set timeout=5
set default=0
insmod all_video

menuentry "Nova Claude OS - Large (1920x1080, 2x scaled)" {
    multiboot /boot/kernel-1920.bin
    boot
}
menuentry "Nova Claude OS - Extra large (2560x1440, 2x scaled)" {
    multiboot /boot/kernel-2560.bin
    boot
}
menuentry "Nova Claude OS - Standard (1024x768)" {
    multiboot /boot/kernel-1024.bin
    boot
}
